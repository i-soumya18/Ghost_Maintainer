name: 💡 Feature Request
description: Propose a new feature, backend adapter, or capability for Ghost Maintainer
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate suggestions to enhance the séance experience and honesty pipeline.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the limitation or issue is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have evaluated.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any mockups, CLI design ideas, or reference commits.
