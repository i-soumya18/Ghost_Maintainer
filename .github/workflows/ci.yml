name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint and format check (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Static type check (Mypy)
        run: uv run mypy src

      - name: Run test suite with coverage (Pytest)
        run: uv run pytest --cov=src/ghost_maintainer --cov-report=xml -v

      - name: Validate evaluation benchmark harness
        run: uv run ghost eval --help

  web-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Web linter check
        working-directory: ./web
        run: npm run lint

      - name: Build web production bundle
        working-directory: ./web
        run: npm run build
