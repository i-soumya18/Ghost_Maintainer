[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghost-maintainer"
version = "0.1.0"
description = "Verifiable, local AI codebase archaeology tool answering in departed maintainers' voices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Ghost Maintainer Authors" }
]
keywords = [
    "git",
    "archaeology",
    "ai",
    "bm25",
    "hallucination-detection",
    "hacktoberfest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "bm25s>=0.1.10",
    "PyStemmer>=2.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sse-starlette>=1.6.0",
    "pyyaml>=6.0",
    "platformdirs>=3.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
unsloth = [
    "torch>=2.2.0",
    "unsloth",
    "bitsandbytes>=0.43.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
]
openai = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
ghost = "ghost_maintainer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_maintainer"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "bm25s.*",
    "Stemmer.*",
    "sse_starlette.*",
    "unsloth.*",
    "bitsandbytes.*",
    "transformers.*",
    "accelerate.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["ghost_maintainer"]
omit = [
    "src/ghost_maintainer/backends/unsloth_backend.py",
]
